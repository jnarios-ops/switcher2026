name: switcher_gps
description: App de clientes Switcher GPS — panel del portal en el teléfono.
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.0
  http: ^1.6.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  url_launcher: ^6.3.1
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo_switcher.png
    - assets/brand/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/ic_launcher_source.png
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: assets/brand/ic_launcher_source.png
  min_sdk_android: 21
